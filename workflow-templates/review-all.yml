name: Организационное двойное ИИ-ревью

"on":
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      (
        github.event.comment.body == '/review-all' ||
        github.event.comment.body == '/review-claude'
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    uses: Abrikosov-group/.github/.github/workflows/review-all.yml@main
    with:
      command: ${{ github.event.comment.body }}
      repository: ${{ github.repository }}
      pr_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
      author_association: ${{ github.event.comment.author_association }}
    secrets:
      REVIEW_DISPATCH_TOKEN: ${{ secrets.REVIEW_DISPATCH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
