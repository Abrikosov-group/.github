name: Проверка инфраструктуры ИИ-ревью

"on":
  pull_request:
    paths:
      - ".github/actions/review-tools/**"
      - ".github/review/**"
      - ".github/workflows/review-all.yml"
      - ".github/workflows/review-all-trigger.yml"
      - ".github/workflows/review-infrastructure-ci.yml"
      - ".github/pull_request_template.md"
      - "workflow-templates/review-all.yml"
      - "workflow-templates/review-all.properties.json"
      - "CONTRIBUTING.md"
      - "README.md"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/actions/review-tools/**"
      - ".github/review/**"
      - ".github/workflows/review-all.yml"
      - ".github/workflows/review-all-trigger.yml"
      - ".github/workflows/review-infrastructure-ci.yml"
      - ".github/pull_request_template.md"
      - "workflow-templates/review-all.yml"
      - "workflow-templates/review-all.properties.json"
      - "CONTRIBUTING.md"
      - "README.md"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: review-infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверить контракт двойного ревью
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Сверить тестируемые утилиты с коммитом закреплённого действия
        shell: bash
        run: |
          set -euo pipefail
          action_sha="$(sed -nE 's#^[[:space:]]*uses: Abrikosov-group/\.github/\.github/actions/review-tools@([0-9a-f]{40})$#\1#p' .github/workflows/review-all.yml | sort -u)"
          [[ "${action_sha}" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code --stat "${action_sha}" HEAD -- .github/actions/review-tools '.github/review/*.mjs' ':!.github/review/*.test.mjs'

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Выполнить контрактные тесты
        run: node --test .github/review/*.test.mjs

      - name: Проверить защиту групп раннеров
        run: node --test scripts/*.test.mjs
