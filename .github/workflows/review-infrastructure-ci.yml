name: Проверка инфраструктуры ИИ-ревью

"on":
  pull_request:
    paths:
      - ".github/review/**"
      - ".github/workflows/review-all.yml"
      - ".github/workflows/review-all-trigger.yml"
      - ".github/workflows/review-infrastructure-ci.yml"
      - ".github/pull_request_template.md"
      - "workflow-templates/review-all.yml"
      - "workflow-templates/review-all.properties.json"
      - "CONTRIBUTING.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - ".github/review/**"
      - ".github/workflows/review-all.yml"
      - ".github/workflows/review-all-trigger.yml"
      - ".github/workflows/review-infrastructure-ci.yml"
      - ".github/pull_request_template.md"
      - "workflow-templates/review-all.yml"
      - "workflow-templates/review-all.properties.json"
      - "CONTRIBUTING.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: review-infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверить контракт двойного ревью
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Выполнить контрактные тесты
        run: node --test .github/review/*.test.mjs
