name: Диагностика профилей Codex

"on":
  workflow_dispatch:
    inputs:
      review_runner_group:
        description: Группа доверенного runner
        required: false
        default: codex-spark-review
        type: string
      codex_runner_label:
        description: Label runner Codex
        required: false
        default: codex-spark-review
        type: string
      expected_runner_name:
        description: Точное имя runner, которое должно быть подтверждено job
        required: false
        default: codex-spark-review-187-127-26-1
        type: string
      expected_runner_names:
        description: Допустимые имена runner через запятую; пусто использует одно точное имя
        required: false
        default: ""
        type: string
      profile_root:
        description: Фиксированный корень трёх профилей на runner
        required: false
        default: /var/lib/codex-spark-review/accounts
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    name: Проверить три профиля и шесть слотов
    runs-on:
      group: ${{ inputs.review_runner_group }}
      labels: ${{ inputs.codex_runner_label }}
    timeout-minutes: 5
    env:
      CODEX_ACCOUNT_PROFILE_ROOT: ${{ inputs.profile_root }}
      EXPECTED_RUNNER_NAME: ${{ inputs.expected_runner_name }}
      EXPECTED_RUNNER_NAMES: ${{ inputs.expected_runner_names }}

    steps:
      - name: Проверить доверенный runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = self-hosted
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = X64
          if [[ -n "${EXPECTED_RUNNER_NAMES}" ]]; then
            case ",${EXPECTED_RUNNER_NAMES}," in
              *,"${RUNNER_NAME}",*) ;;
              *) echo "::error::Недоверенный runner: ${RUNNER_NAME}"; exit 1 ;;
            esac
          else
            test "${RUNNER_NAME}" = "${EXPECTED_RUNNER_NAME}"
          fi

      - name: Получить диагностический код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Выполнить metadata-only диагностику
        id: diagnostic
        shell: bash
        continue-on-error: true
        run: |
          set +e
          node .github/review/codex-account-diagnostic.mjs \
            --profile-root "${CODEX_ACCOUNT_PROFILE_ROOT}" \
            --report-path "${RUNNER_TEMP}/codex-account-diagnostic.json" \
            > "${RUNNER_TEMP}/codex-account-diagnostic.stdout"
          exit_code=$?
          cat "${RUNNER_TEMP}/codex-account-diagnostic.stdout" >> "${GITHUB_STEP_SUMMARY}"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Завершить с результатом диагностики
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${DIAGNOSTIC_EXIT_CODE:-2}" != "0" ]]; then
            echo "::error::Диагностика не подтвердила все профили: canary не разрешён"
            exit 1
          fi
